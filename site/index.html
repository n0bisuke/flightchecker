<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Checker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Flight Checker</h1>
    <p class="meta" id="updated">読み込み中…</p>
  </header>
  <main id="routes"></main>
  <footer>
    <p>「買い時の目安」は過去の観測値と出発までの日数から機械的に判定したものです。将来の価格を保証するものではありません。</p>
  </footer>
  <template id="route-card">
    <section class="card">
      <div class="card-head">
        <div>
          <h2 class="label"></h2>
          <p class="meta dates"></p>
        </div>
        <span class="badge"></span>
      </div>
      <p class="reason"></p>
      <dl class="stats"></dl>
      <ul class="by-date"></ul>
      <div class="chart-wrap"><canvas></canvas></div>
      <details>
        <summary>最新の運賃一覧（全候補日）</summary>
        <table class="quotes">
          <thead><tr><th>出発日</th><th>取得元</th><th>航空会社</th><th>価格</th><th>経由</th><th>所要</th></tr></thead>
          <tbody></tbody>
        </table>
      </details>
    </section>
  </template>
</body>
</html>
